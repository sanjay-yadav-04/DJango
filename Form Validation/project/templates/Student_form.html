<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Student Form</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="card shadow p-4 w-50">
        <h2 class="text-center mb-4">Student Form</h2>

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Name -->
          <label>Name:</label>
          {{ form.name }}
          <div style="color: red;">{{ form.name.errors }}</div>

          <!-- Age -->
          <label>Age:</label>
          {{ form.age }}
          <div style="color: red;">{{ form.age.errors }}</div>

          <!-- Email -->
          <label>Email:</label>
          {{ form.email }}
          <div style="color: red;">{{ form.email.errors }}</div>

          <!-- City -->
          <label>City:</label>
          {{ form.city }}
          <div style="color: red;">{{ form.city.errors }}</div>

          <br />

          <button type="submit" class="btn btn-primary w-100 mt-3">
            Submit
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
