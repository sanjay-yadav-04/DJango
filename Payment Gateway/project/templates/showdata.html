<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Add To Cart</title>
</head>

<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center mb-4">Show Data</h2>

  <table class="table table-bordered text-center">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Color</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Category</th>
        <th>Add To Cart</th>
      </tr>
    </thead>

    <tbody>
      {% for i in data %}
      <tr>
        <td>{{ i.name }}</td>
        <td>{{ i.des }}</td>
        <td>{{ i.color }}</td>
        <td>{{ i.quantity }}</td>
        <td>₹{{ i.price }}</td>
        <td>{{ i.category }}</td>
        <td><a href="{% url 'cart' pk=i.id %}"><button type="submit">Add To Cart</button></a></td>
      </tr>
      {% endfor %}
    </tbody>

  </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
